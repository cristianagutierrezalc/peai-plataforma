# .github/workflows/ci-cd.yml
# CI/CD Pipeline para PEA-i Plataforma
# Ejecuta tests, lint, build y deploy automático a Render

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch: # Permite ejecución manual

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # TESTS BACKEND
  # ==========================================
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          python -m pytest ../pruebas/test_pea.py -v --tb=short || true
        # Nota: test_pea.py está en pruebas/ del proyecto original

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check . --output-format=github || true

  # ==========================================
  # TESTS FRONTEND
  # ==========================================
  frontend-test:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || true

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://peai-backend.onrender.com

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ==========================================
  # DEPLOY A RENDER (solo en main)
  # ==========================================
  deploy-render:
    name: Deploy to Render
    needs: [backend-test, frontend-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Render (Blueprint)
        uses: render-community/action-render@v1
        with:
          render-api-key: ${{ secrets.RENDER_API_KEY }}
          render-yaml-path: render.yaml
          wait-for-completion: true
          timeout: 600

      - name: Verify deployment
        run: |
          sleep 30
          curl -f https://peai-backend.onrender.com/health || exit 1
          curl -f https://peai-frontend.onrender.com/ || exit 1
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}

  # ==========================================
  # NOTIFICACIONES
  # ==========================================
  notify:
    name: Notify
    needs: [deploy-render]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send status
        run: |
          STATUS="${{ needs.deploy-render.result }}"
          if [ "$STATUS" = "success" ]; then
            echo "✅ Deploy exitoso en Render"
            echo "Frontend: https://peai-frontend.onrender.com"
            echo "Backend:  https://peai-backend.onrender.com"
            echo "API Docs: https://peai-backend.onrender.com/docs"
          else
            echo "❌ Deploy falló - revisa logs en GitHub Actions"
            exit 1
          fi