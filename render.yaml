# render.yaml - Blueprint del backend de PEA-i Plataforma.
#
# Solo declara el backend. El frontend se despliega en Vercel (Opcion A) y
# la base de datos es Supabase, porque el Postgres gratis de Render se elimina
# a los 30 dias y perderias todos los datos.
#
# En Render: New + -> Blueprint -> conecta tu repo GitHub.

services:
  - type: web
    name: peai-backend
    runtime: python3
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Obligatorias en produccion: la app se niega a arrancar sin ellas.
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"

      # DATABASE_URL va en sync: false porque incluye la clave de Supabase.
      # Pega aqui la cadena del POOLER (no la directa, que solo tiene IPv6):
      #   postgresql://postgres.<TU_PROYECTO>:<PASSWORD>@aws-0-us-east-1.pooler.supabase.com:6543/postgres
      - key: DATABASE_URL
        sync: false

      # SECRET_KEY la genera Render. Nunca la pongas en el repo.
      - key: SECRET_KEY
        generateValue: true

      # Credenciales del primer administrador. Sin ellas no hay forma de
      # crear usuarios, porque /api/auth/register esta cerrado.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_ROL
        value: admin

      # Ajusta al dominio real del frontend en Vercel.
      - key: CORS_ORIGINS
        sync: false

      # Pool de conexiones hacia Supabase.
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "300"