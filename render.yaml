# render.yaml - Blueprint para deploy automático en Render
# Uso: En Render Dashboard -> New + -> Blueprint -> Conecta tu repo GitHub
# Render creará: PostgreSQL, Backend (Web Service), Frontend (Static Site)

services:
  # 1. BASE DE DATOS POSTGRESQL
  #    AVISO: el plan free de Render se elimina a los 30 dias.
  #    Para datos permanentes usa Supabase y comenta este bloque,
  #    dejando DATABASE_URL apuntando a la connection string de Supabase.
  - type: pserv
    name: peai-db
    plan: free
    ipAllowList: []

  # 2. BACKEND - FastAPI Web Service
  - type: web
    name: peai-backend
    runtime: python3
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: peai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # Endpoint de registro cerrado: solo un admin autenticado crea usuarios.
      # El primero se crea con el seeder a partir de estas variables.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NOMBRE
        value: Administrador
      - key: ADMIN_ROL
        value: admin
      # Ajusta al dominio real del frontend. Vite incrusta VITE_API_URL
      # en el bundle, asi que cambiarlo exige redesplegar el frontend.
      - key: CORS_ORIGINS
        value: '["https://peai-frontend.onrender.com", "http://localhost:3000"]'
      - key: DEBUG
        value: "false"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "10"
      - key: DB_POOL_RECYCLE
        value: "300"

  # 3. FRONTEND - Static Site (React + Vite)
  - type: static
    name: peai-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      - key: VITE_API_URL
        value: https://peai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html