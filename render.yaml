# render.yaml - Blueprint para deploy automático en Render
# Uso: En Render Dashboard -> New + -> Blueprint -> Conecta tu repo GitHub
# Render creará: PostgreSQL, Backend (Web Service), Frontend (Static Site)

services:
  # 1. BASE DE DATOS POSTGRESQL
  - type: pserv
    name: peai-db
    plan: free
    ipAllowList: []

  # 2. BACKEND - FastAPI Web Service
  - type: web
    name: peai-backend
    runtime: python3
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: peai-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        value: '["https://peai-frontend.onrender.com", "http://localhost:3000"]'
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11"

  # 3. FRONTEND - Static Site (React + Vite)
  - type: static
    name: peai-frontend
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    plan: free
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    envVars:
      - key: VITE_API_URL
        value: https://peai-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html